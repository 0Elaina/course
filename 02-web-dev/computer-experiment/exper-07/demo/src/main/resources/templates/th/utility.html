<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>th:utility 公用对象演示</title>
    <style>
        body { background-color: #e0ffff; font-family: sans-serif; padding: 30px; }
        .box { max-width: 680px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .item-row { margin: 10px 0; padding: 8px 12px; background: #f8f9fa; border-radius: 4px; }
        .label { font-weight: bold; color: #333; }
        .value { color: #0d6efd; font-family: monospace; font-size: 15px; margin-left: 10px; }
        .nav-links { text-align: center; margin-top: 25px; font-size: 14px; }
        a { color: #0d6efd; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>【实例3.1 - 8】Thymeleaf 内置公用对象 (Utility Objects) 演示</h3>
        <hr>

        <div class="item-row">
            <span class="label">1. #dates 日期格式化：</span>
            <span class="value" th:text="${#dates.format(currentDate, 'yyyy年MM月dd日 HH:mm:ss')}"></span>
        </div>

        <div class="item-row">
            <span class="label">2. #numbers 货币/千分位：</span>
            <span class="value" th:text="${#numbers.formatDecimal(price, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="item-row">
            <span class="label">3. #strings 去除空格与大写：</span>
            <span class="value" th:text="${#strings.toUpperCase(#strings.trim(rawString))}"></span>
        </div>

        <div class="item-row">
            <span class="label">4. #lists 列表大小：</span>
            <span class="value" th:text="'列表中共有 ' + ${#lists.size(fruits)} + ' 项元素'"></span>
        </div>

        <div class="item-row">
            <span class="label">5. #lists 列表包含判断：</span>
            <span class="value" th:text="'是否包含洛川苹果: ' + ${#lists.contains(fruits, '洛川苹果')}"></span>
        </div>

        <div class="item-row">
            <span class="label">6. #bools 布尔逻辑：</span>
            <span class="value" th:text="'状态判断: ' + ${#bools.isTrue(isEnabled)}"></span>
        </div>
    </div>

    <div class="nav-links">
        <a th:href="@{/valid}">前往数据校验案例</a> | 
        <a th:href="@{/bootstrap}">前往Bootstrap整合案例</a> | 
        <a th:href="@{/}">返回实验导航总览</a>
    </div>
</body>
</html>
