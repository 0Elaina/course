<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>th:text演示</title>
    <style>
        body { background-color: #e0ffff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .box { display: inline-block; padding: 20px 40px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .nav-links { margin-top: 30px; font-size: 14px; }
        a { color: #0d6efd; text-decoration: none; margin: 0 10px; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="box">
        <h3>【实例3.1 - 1】th:text 显示文本演示</h3>
        <!-- PPT 原版演示语句 -->
        <h2 th:text="${name}?:'请提交商家名称！'"></h2>
    </div>

    <div class="nav-links">
        <p>测试链接：
            <a th:href="@{/th/text(sname='陕西洛川苹果有限公司')}">带参测试（陕西洛川苹果有限公司）</a> | 
            <a th:href="@{/th/text}">无参测试（显示默认提示）</a> | 
            <a th:href="@{/}">返回实验导航总览</a>
        </p>
    </div>
</body>
</html>
