<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>表单输入提交演示</title>
    <style>
        body { background-color: #e0ffff; font-family: sans-serif; padding: 40px; }
        .box { max-width: 480px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 90%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        input[type="submit"] { padding: 8px 24px; background: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .tip { font-size: 13px; color: #666; margin-top: 15px; }
        .nav-links { text-align: center; margin-top: 25px; font-size: 14px; }
        a { color: #0d6efd; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>【实例3.1 - 3】表单输入绑定演示 (th:field)</h3>
        <hr>
        <!-- PPT 原版表单 -->
        <div>
            <form th:action="@{/th/object}" th:object="${sup}" method="post">
                <div class="form-group">
                    <label>商家名称 (th:field="*{sname}")：</label>
                    <input th:type="text" th:field="*{sname}" placeholder="请输入商家名称"/>
                </div>
                <div class="form-group">
                    <label>微信联系方式 (th:field="${sup.sweixin}")：</label>
                    <input th:type="text" th:field="${sup.sweixin}" placeholder="请输入微信号"/>
                </div>
                <div style="text-align: right; width: 93%;">
                    <input th:type="submit" value="提交">
                </div>
            </form>
        </div>
        <p class="tip">💡 说明：th:field 自动双向绑定模型初值与字段名，点击“提交”将携带数据跳转至 /th/object 查看渲染效果。</p>
    </div>

    <div class="nav-links">
        <a th:href="@{/th/href}">前往超链接演示页</a> | 
        <a th:href="@{/}">返回实验导航总览</a>
    </div>
</body>
</html>
