server:
  port: 8080

spring:
  application:
    name: blog

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/blogdb;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

logging:
  level:
    root: INFO
    com.nep: DEBUG
    org.springframework: DEBUG
  file:
    name: ./logs/blog.log
  logback:
    rollingpolicy:
      file-name-pattern: ./logs/blog-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
